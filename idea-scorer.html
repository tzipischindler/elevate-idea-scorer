<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Hackathon Idea Scorer</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;



const CRITERIA = [
  {
    key: 'pain',
    label: 'Personal pain evidence',
    hint: 'Did you or someone close to you actually live this, with a real cost?',
  },
  {
    key: 'evidence',
    label: 'Public evidence strength',
    hint: 'Strong = named threads/complaints with engagement. Adjacent = category is documented but not this exact case. Anecdotal = just you.',
    scale: ['Anecdotal only', 'Adjacent category', 'Some direct signal', 'Multiple sources', 'Strong, measurable'],
  },
  {
    key: 'noFix',
    label: 'No good existing fix',
    hint: 'Do people currently patch it with something clunky (workaround, manual process)?',
  },
  {
    key: 'buildable',
    label: 'Buildable in 2 weeks',
    hint: 'Can a demo show the core value without access you will not get in time?',
  },
  {
    key: 'relatable',
    label: 'Judge / audience relatability',
    hint: 'Will people instantly get why this hurts, with no explanation needed?',
  },
  {
    key: 'portfolio',
    label: 'Career / portfolio fit',
    hint: 'Independent of market gap: does building this move you toward a role or skill you actually want?',
  },
];

const WEIGHTS = {
  pain: 1,
  evidence: 1,
  noFix: 1,
  buildable: 1.5,
  relatable: 1,
  portfolio: 3,
};

const emptyScores = () =>
  Object.fromEntries(CRITERIA.map((c) => [c.key, 3]));

const IS_DEMO = new URLSearchParams(window.location.search).get('mode') === 'demo';

const STARTER_IDEAS = [
  {
    id: 1,
    title: 'Cross-border loan access after relocation',
    problem:
      'Bank apps/sites geoblock users from certain countries, stranding people with active loans with no self-service path to pay off.',
    solution:
      '',
    uniqueValueProposition: '',
    unfairAdvantage: '',
    customerSegments: '',
    existingAlternatives: '',
    scores: {
      pain: 5,
      evidence: 2,
      noFix: 4,
      buildable: 3,
      relatable: 4,
      portfolio: 3,
    },
  },
  {
    id: 3,
    title: 'Emotional attunement for bureaucracy limbo (Germany)',
    problem:
      'AI bureaucracy-navigation tools already exist (SmartBürokratie, Ridocu, Sportellino) but are process/document-focused, not emotionally attuned. General AI emotional-support is saturated and regulated. The gap: emotional fidelity specifically during high-stakes waiting/limbo (Ausländerbehörde silence, visa uncertainty) — close to a potential partner\'s thesis work on emotional fidelity in disaster-response translation. Depends heavily on that partner\'s domain expertise to build well.',
    solution:
      '',
    uniqueValueProposition: '',
    unfairAdvantage: '',
    customerSegments: '',
    existingAlternatives: '',
      scores: {
      pain: 5,
      evidence: 3,
      noFix: 3,
      buildable: 2,
      relatable: 5,
      portfolio: 4,
    },
  },
  {
    id: 4,
    title: 'Networking to stay in Germany (visa/economic limbo)',
    problem:
      'Peer-to-peer "who do I call" networking for people trying to stay in Germany outside clean visa categories. Heavily served already: government Work-and-Stay Agency launching 2026, regional WelcomeCenters, commercial relocation platforms. Real pain, but crowded and partly government-owned.',
    solution: '',
    uniqueValueProposition: '',
    unfairAdvantage: '',
    customerSegments: '',
    existingAlternatives: '',
    scores: {
      pain: 4,
      evidence: 3,
      noFix: 2,
      buildable: 2,
      relatable: 4,
      portfolio: 2,
    },
  },
  {
    id: 5,
    title: 'Humanizing the geoblock moment (UX, not infrastructure)',
    problem:
      'While the infrastructure is in place to address geoblocking, the user-facing experience is often abrupt and unhelpful. Users are left confused and frustrated when they encounter geoblocks, especially in sensitive situations like financial transactions or accessing essential services.',
    solution:
      'The open gap: no one designs the human-facing moment of being blocked — plain-language explanation, dignity, a real next step — for the person experiencing it, not the business. Could be a UX overlay, a browser extension, or a service that provides context and guidance when geoblocked.',
    uniqueValueProposition: '',
    unfairAdvantage: 'Having access to awesome UX talent and a founder with lived experience of geoblocking pain.',
    customerSegments: 'Non technical users who encounter geoblocks in financial, governmental, or essential service contexts.',
    existingAlternatives: 'Geolocation fraud/compliance infrastructure (GeoComply, MaxMind, etc.)',
    scores: {
      pain: 5,
      evidence: 2,
      noFix: 4,
      buildable: 5,
      relatable: 5,
      portfolio: 4,
    },
  },
  {
    id: 2,
    title: 'Ecological transparency for AI chat usage',
    problem:
      'Consumers are usong AI chat daily without awarness of the envioremental cost and without being able to make consciouces decisions regarding using the AI chat on the enviorment, while AI labs subsidize usage at a loss (OpenAI ~$14B burn in 2026); ad-funded AI browsers like Arpeely are emerging to monetize AI usage and creating oppertunity to move that trevenue towards ofsetting the ecological footprint, but today such a browser doesnt offer transparency or offset layer. ',
    solution: 'Awareness-first, business-funded (not user-funded) framing, echoing Ecosia tool that allows to make counscious decisions regarding powered by AI usage for consumer decision making and daily activities',

      portfolio: 3,

  },
  {
    id: 6,
    title: 'AI agent budget/velocity estimation for solo founders',
    problem:
      'When going about our startup idea, we want to be able to manage our AI agent budget and velocity, agents burn through credits unpredictably and suggest features we need to make a judgment about that we might not need at this stage of our product development, a solo founder can find herself not knowing what a certain task would cost, while big companies can pay for enterprise solutions to solve this, the small founder can use a simple tool that would let her plan ahead of time her budget and make calculated data guided decisions around her credit allocation. ',
    solution: 'We have a tool to plan our agent velocity without using our own credits or paying for it.',
    unfairAdvantage: '5 years of experience with planning team velocity without dependence on AI',
    customerSegments: 'pre-funding solo/small-team founder using consumer-tier AI.',
    existingAlternatives: 'Datadog LLM Observability, CloudZero, Flexprice, Portal26, TrueFoundry. ',
    scores: {
      pain: 4,
      evidence: 4,
      noFix: 1,
      buildable: 4,
      relatable: 3,
      portfolio: 5,
    },
  },
  {
    id: 7,
    title: 'Situational imposter-syndrome check-in tool',
    problem:
      '68% of women in tech report imposter syndrome that presents as a physical stress response and narrative questioning her ability to go about the task that impacts the liklihood to take on challanges and the execution. ',
    solution: 'Short and consciese self-check-in tool for situational imposter syndrome, with a wins-log mechanic and optional AI reframing.',
    uniqueValueProposition: '',
    unfairAdvantage: 'differentiator would be personal specificity/UX and alignment with founder\'s own holistic-leadership brand',
    customerSegments: 'Women in tech',
    existingAlternatives: 'Still researching what is available, the specific mechanic (body check-in, breathing, recall a matched past win) overlaps closely with existing tools — Rocky.ai (conversational cognitive reframing) and a "Confidence Coach" GPT already built on a wins-log mechanic.',
    scores: {
      pain: 5,
      evidence: 3,
      noFix: 2,
      buildable: 3,
      relatable: 5,
      portfolio: 5,
    },
  },
  {
    id: 8,
    title: 'Open-source AI-era tech debt estimation tool (developer-facing)',
    problem:
      'Real, well-documented pain: GitClear found an 8x rise in duplicated code blocks in AI-assisted commits (2024), and AI-generated code reportedly creates 1.7x more issues per PR. Enterprise tools already address this (SonarQube, CodeScene, Exceeds AI), but all are sold top-down to engineering leadership as paid, per-seat dashboards. Gap: nothing free/open-source framed for an individual developer to self-serve data for a team conversation, without needing management buy-in first. Strong personal fit: founder spent years at Native Instruments quantifying tech-debt cost to justify budget allocation — rare, credible domain depth for this specific niche.',
    solution: '',
    uniqueValueProposition: '',
    unfairAdvantage: '',
    customerSegments: '',
    existingAlternatives: '',
    scores: {
      pain: 4,
      evidence: 4,
      noFix: 2,
      buildable: 3,
      relatable: 3,
      portfolio: 5,
    },
  },
];

function weightedTotal(scores) {
  const sum = CRITERIA.reduce((acc, c) => acc + scores[c.key] * WEIGHTS[c.key], 0);
  const max = CRITERIA.reduce((acc, c) => acc + 5 * WEIGHTS[c.key], 0);
  return { sum, max, pct: Math.round((sum / max) * 100) };
}

function Slider({ criterion, value, onChange }) {
  const scaleLabel = criterion.scale ? criterion.scale[value - 1] : null;
  return (
    <div style={{ marginBottom: '18px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '4px' }}>
        <label style={{ fontSize: '14px', fontWeight: 600, color: '#2b2b26' }}>{criterion.label}</label>
        <span style={{ fontSize: '13px', color: '#8a7f6a', fontVariantNumeric: 'tabular-nums' }}>
          {scaleLabel || value}
        </span>
      </div>
      <p style={{ fontSize: '12px', color: '#9c927d', margin: '0 0 8px 0', lineHeight: 1.4 }}>{criterion.hint}</p>
      <input
        type="range"
        min={1}
        max={5}
        step={1}
        value={value}
        onChange={(e) => onChange(criterion.key, Number(e.target.value))}
        style={{
          width: '100%',
          accentColor: '#a8562f',
          height: '4px',
        }}
      />
    </div>
  );
}

function AutoResizeTextarea({ value, onChange, placeholder }) {
  const textareaRef = useRef(null);

  useEffect(() => {
    if (textareaRef.current) {
      textareaRef.current.style.height = 'auto';
      textareaRef.current.style.height = `${textareaRef.current.scrollHeight}px`;
    }
  }, [value]);

  const handleChange = (event) => {
    event.target.style.height = 'auto';
    event.target.style.height = `${event.target.scrollHeight}px`;
    onChange(event.target.value);
  };

  return (
    <textarea
      ref={textareaRef}
      value={value}
      onChange={handleChange}
      placeholder={placeholder}
      rows={1}
      style={{
        width: '100%',
        minHeight: '3em',
        fontSize: '13px',
        color: '#5a5346',
        border: 'none',
        background: 'transparent',
        outline: 'none',
        resize: 'none',
        overflow: 'hidden',
        fontFamily: 'inherit',
        padding: 0,
        lineHeight: 1.5,
      }}
    />
  );
}

function IdeaCard({ idea, onUpdate, onDelete, isTop }) {
  const { sum, pct } = weightedTotal(idea.scores);
  const noteFields = [
    { key: 'problem', label: 'Problem', placeholder: 'What problem are you solving?' },
    { key: 'solution', label: 'Solution', placeholder: 'What are you building to solve it?' },
    { key: 'uniqueValueProposition', label: 'Unique Value Proposition', placeholder: 'What distinct value does this idea provide?' },
    { key: 'unfairAdvantage', label: 'Unfair Advantage', placeholder: 'Why are you especially well-positioned to solve it?' },
    { key: 'customerSegments', label: 'Customer Segments', placeholder: 'Who specifically experiences this problem?' },
    { key: 'existingAlternatives', label: 'Existing Alternatives', placeholder: 'What do people use or do today instead?' },
  ];

  return (
    <div
      id={`idea-${idea.id}`}
      style={{
        background: isTop ? '#fbf3e9' : '#fdfcfa',
        border: isTop ? '1.5px solid #a8562f' : '1px solid #e5ddd0',
        borderRadius: '10px',
        padding: '20px',
        marginBottom: '20px',
        position: 'relative',
      }}
    >
      {isTop && (
        <div
          style={{
            position: 'absolute',
            top: '-11px',
            left: '20px',
            background: '#a8562f',
            color: '#fdfcfa',
            fontSize: '11px',
            fontWeight: 600,
            padding: '3px 10px',
            borderRadius: '20px',
            letterSpacing: '0.02em',
          }}
        >
          Leading
        </div>
      )}

      <div style={{ display: 'flex', justifyContent: 'space-between', gap: '16px', marginBottom: '10px' }}>
        <input
          value={idea.title}
          onChange={(e) => onUpdate(idea.id, { ...idea, title: e.target.value })}
          placeholder="Idea title"
          style={{
            fontSize: '17px',
            fontWeight: 700,
            fontFamily: 'Georgia, serif',
            color: '#2b2b26',
            border: 'none',
            background: 'transparent',
            outline: 'none',
            flex: 1,
            padding: 0,
          }}
        />
        <button
          onClick={() => onDelete(idea.id)}
          style={{
            border: 'none',
            background: 'transparent',
            color: '#b8ab8f',
            cursor: 'pointer',
            fontSize: '13px',
            padding: '2px 6px',
          }}
        >
          remove
        </button>
      </div>

      <div style={{ marginBottom: '16px' }}>
        {noteFields.map((field) => (
          <div key={field.key} style={{ marginBottom: '12px' }}>
            <label
              style={{
                display: 'block',
                fontSize: '11px',
                fontWeight: 700,
                color: '#a8562f',
                textTransform: 'uppercase',
                letterSpacing: '0.08em',
                marginBottom: '4px',
              }}
            >
              {field.label}
            </label>
            <AutoResizeTextarea
              value={idea[field.key] || ''}
              onChange={(value) => onUpdate(idea.id, { ...idea, [field.key]: value })}
              placeholder={field.placeholder}
            />
          </div>
        ))}
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: '14px', marginBottom: '18px' }}>
        <div
          style={{
            fontSize: '28px',
            fontWeight: 700,
            fontFamily: 'Georgia, serif',
            color: '#a8562f',
            minWidth: '58px',
          }}
        >
          {pct}
        </div>
        <div style={{ flex: 1, height: '6px', background: '#e5ddd0', borderRadius: '3px', overflow: 'hidden' }}>
          <div
            style={{
              width: `${pct}%`,
              height: '100%',
              background: '#a8562f',
              borderRadius: '3px',
              transition: 'width 0.3s ease',
            }}
          />
        </div>
        <div style={{ fontSize: '12px', color: '#9c927d' }}>weighted score</div>
      </div>

      {CRITERIA.map((c) => (
        <Slider
          key={c.key}
          criterion={c}
          value={idea.scores[c.key]}
          onChange={(key, val) => onUpdate(idea.id, { ...idea, scores: { ...idea.scores, [key]: val } })}
        />
      ))}
    </div>
  );
}

function IdeaScorer() {
  const [ideas, setIdeas] = useState(() => (IS_DEMO ? STARTER_IDEAS : []));

  const addIdea = () => {
    const id = Date.now();
    setIdeas([
      ...ideas,
      {
        id,
        title: 'New idea',
        problem: '',
        solution: '',
        uniqueValueProposition: '',
        unfairAdvantage: '',
        customerSegments: '',
        existingAlternatives: '',
        scores: emptyScores(),
      },
    ]);
  };

  const updateIdea = (id, updated) => {
    setIdeas(ideas.map((i) => (i.id === id ? updated : i)));
  };

  const deleteIdea = (id) => {
    setIdeas(ideas.filter((i) => i.id !== id));
  };

  const ranked = [...ideas].sort((a, b) => weightedTotal(b.scores).sum - weightedTotal(a.scores).sum);
  const topId = ranked.length > 1 ? ranked[0].id : null;

  return (
    <div
      style={{
        fontFamily: "'Iowan Old Style', 'Palatino Linotype', Georgia, serif",
        background: '#f5f0e6',
        minHeight: '100vh',
        padding: '32px 16px',
      }}
    >
      <div style={{ maxWidth: '640px', margin: '0 auto' }}>
        <h1
          style={{
            fontSize: '26px',
            fontWeight: 700,
            color: '#2b2b26',
            marginBottom: '6px',
            fontFamily: 'Georgia, serif',
          }}
        >
          Which idea gets the pitch?
        </h1>
        <p style={{ fontSize: '14px', color: '#8a7f6a', marginBottom: '32px', lineHeight: 1.5 }}>
          Score each user story on the same six axes. Buildability counts for more — a hackathon can't
          reward a problem it can't demo. Drag the sliders as your read on each idea changes.
        </p>

        <div style={{ display: 'flex', gap: '12px', marginBottom: '24px', fontSize: '12px' }}>
          <a href="?" style={{ color: IS_DEMO ? '#8a7f6a' : '#a8562f' }}>
            Blank tool
          </a>
          <a href="?mode=demo" style={{ color: IS_DEMO ? '#a8562f' : '#8a7f6a' }}>
            Filled example
          </a>
        </div>

        {ranked.length > 0 && (
          <div
            style={{
              background: '#fdfcfa',
              border: '1px solid #e5ddd0',
              borderRadius: '10px',
              padding: '16px 18px',
              marginBottom: '24px',
            }}
          >
            <div
              style={{
                fontSize: '11px',
                fontWeight: 700,
                color: '#a8562f',
                textTransform: 'uppercase',
                letterSpacing: '0.08em',
                marginBottom: '10px',
              }}
            >
              Scoreboard
            </div>
            {ranked.map((idea, index) => (
              <a
                key={idea.id}
                href={`#idea-${idea.id}`}
                style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: '10px',
                  color: '#2b2b26',
                  textDecoration: 'none',
                  fontSize: '13px',
                  padding: '7px 0',
                  borderTop: index === 0 ? 'none' : '1px solid #eee8de',
                }}
              >
                <span style={{ width: '20px', color: '#9c927d', fontVariantNumeric: 'tabular-nums' }}>
                  {index + 1}.
                </span>
                <span style={{ flex: 1 }}>{idea.title || 'Untitled idea'}</span>
                <strong style={{ color: '#a8562f', fontVariantNumeric: 'tabular-nums' }}>
                  {weightedTotal(idea.scores).pct}
                </strong>
              </a>
            ))}
          </div>
        )}

        {ranked.map((idea) => (
          <IdeaCard
            key={idea.id}
            idea={idea}
            onUpdate={updateIdea}
            onDelete={deleteIdea}
            isTop={idea.id === topId}
          />
        ))}

        <button
          onClick={addIdea}
          style={{
            width: '100%',
            padding: '14px',
            background: 'transparent',
            border: '1.5px dashed #c9bda3',
            borderRadius: '10px',
            color: '#8a7f6a',
            fontSize: '14px',
            fontFamily: 'inherit',
            cursor: 'pointer',
            marginTop: '4px',
          }}
        >
          + Add another user story
        </button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<IdeaScorer />);
</script>
</body>
</html>
